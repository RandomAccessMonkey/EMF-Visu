[project]
name = "emf-api"
version = "0.1.0"
description = "EMF-Visu backend API: validation, orchestration, persistence."
requires-python = ">=3.12,<3.14"
dependencies = [
  "emf-core", "emf-worker",
  "fastapi>=0.163,<0.164", "uvicorn[standard]>=0.54,<0.55",
  "pydantic-settings>=2.16,<3", "sqlalchemy>=2.1,<2.2", "psycopg[binary]>=3.3,<3.4",
]

[tool.uv.sources]
emf-core = { workspace = true }
emf-worker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emf_api"]
