[project]
name = "emf-core"
version = "0.1.0"
description = "EMF-Visu physics engine: scene model, solvers, equation registry, wire format. No web dependencies."
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2.5,<3", "scipy>=1.18,<2", "pydantic>=2.14,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emf_core"]
