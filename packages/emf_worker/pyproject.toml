[project]
name = "emf-worker"
version = "0.1.0"
description = "EMF-Visu solver-agnostic worker runtime (job protocol, Celery app, result store)."
requires-python = ">=3.12,<3.14"
dependencies = ["emf-core", "celery[redis]>=5.7,<6", "redis>=6,<9"]

[tool.uv.sources]
emf-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emf_worker"]
