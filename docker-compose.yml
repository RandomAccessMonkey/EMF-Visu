# EMF-Visu local stack:  docker compose up --build   ->  http://localhost:8080
# Solver workers are separate services. FEM (DOLFINx/Gmsh) and FDTD (Meep) workers are not
# implemented yet (Phase 5); they will be added as additional, optional services.
name: emf-visu

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emf}
      POSTGRES_DB: ${POSTGRES_DB:-emf}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    environment:
      EMF_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-emf}:${POSTGRES_PASSWORD:-emf}@postgres:5432/${POSTGRES_DB:-emf}
      EMF_REDIS_URL: redis://redis:6379/0
      EMF_CORS_ORIGINS: ${EMF_CORS_ORIGINS:-http://localhost:8080}
      EMF_SYNC_POINT_LIMIT: ${EMF_SYNC_POINT_LIMIT:-400000}
      EMF_CACHE_ENTRIES: ${EMF_CACHE_ENTRIES:-64}
      EMF_RESULT_TTL_S: ${EMF_RESULT_TTL_S:-3600}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "${API_PORT:-8000}:8000"

  worker-analytical:
    build:
      context: .
      dockerfile: services/worker_analytical/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    environment:
      EMF_REDIS_URL: redis://redis:6379/0
      EMF_RESULT_TTL_S: ${EMF_RESULT_TTL_S:-3600}
    depends_on:
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-slim}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.29-alpine}
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  pgdata:
