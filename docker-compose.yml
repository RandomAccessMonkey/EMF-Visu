# EMF-Visu local stack.
#   start:  docker compose up -d --build      ->  http://localhost:8080
#   stop:   docker compose down               (saved projects stay in the pgdata volume)
# See docs/local-preview.md. Solver workers are separate services; FEM (DOLFINx/Gmsh) and FDTD
# (Meep) workers are not implemented yet (Phase 5).
name: emf-visu

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emf}
      POSTGRES_DB: ${POSTGRES_DB:-emf}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    environment:
      EMF_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-emf}:${POSTGRES_PASSWORD:-emf}@postgres:5432/${POSTGRES_DB:-emf}
      EMF_REDIS_URL: redis://redis:6379/0
      EMF_CORS_ORIGINS: ${EMF_CORS_ORIGINS:-http://localhost:8080}
      EMF_SYNC_POINT_LIMIT: ${EMF_SYNC_POINT_LIMIT:-400000}
      EMF_CACHE_ENTRIES: ${EMF_CACHE_ENTRIES:-64}
      EMF_RESULT_TTL_S: ${EMF_RESULT_TTL_S:-3600}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Only needed for direct API access (e.g. http://localhost:8000/docs); the app reaches the
    # API through the frontend. Bound to this computer only by default.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"

  worker-analytical:
    build:
      context: .
      dockerfile: services/worker_analytical/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    environment:
      EMF_REDIS_URL: redis://redis:6379/0
      EMF_RESULT_TTL_S: ${EMF_RESULT_TTL_S:-3600}
    depends_on:
      redis: { condition: service_healthy }
    # Serves queued (high-resolution) solves; the rest of the app works without it.
    healthcheck:
      test: ["CMD-SHELL", "celery -A emf_worker.app inspect ping -d celery@$${HOSTNAME} --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-slim}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.29-alpine}
    depends_on:
      api: { condition: service_healthy }
    # Bound to this computer only; set BIND_ADDRESS=0.0.0.0 in .env to allow other devices.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"

volumes:
  # Saved projects. Survives "docker compose down"; only "docker compose down -v" deletes it.
  pgdata:
